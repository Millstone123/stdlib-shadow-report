[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "figures-check"
version = "1.0.0"
description = "Q3 2026 figures check"
requires-python = ">=3.8"
dependencies = ["pytest>=7"]

[project.entry-points.pytest11]
figures_check = "figures_check.plugin"

[tool.setuptools.packages.find]
where = ["src"]
